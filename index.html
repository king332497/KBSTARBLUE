<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KBStar — Prototipe</title>
<link rel="canonical" href="01-beranda.html">
<style>
  html,body{height:100%;margin:0}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#f4edfb;color:#6a4b8f;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  .kb-bar{position:fixed;top:0;left:0;height:3px;width:100%;background:linear-gradient(90deg,transparent,#7b24c7,#b06be8,transparent);background-size:40% 100%;background-repeat:no-repeat;animation:kb-slide 1s ease-in-out infinite}
  .kb-spin{width:48px;height:48px;border-radius:50%;border:4px solid #e2d2f3;border-top-color:#7b24c7;animation:kb-rot .7s linear infinite}
  .kb-txt{font-weight:600;font-size:13px;letter-spacing:.02em}
  a{color:#7b24c7;font-weight:600}
  @keyframes kb-rot{to{transform:rotate(360deg)}}
  @keyframes kb-slide{0%{background-position:-40% 0}100%{background-position:140% 0}}
</style>
<script>setTimeout(function(){location.replace('01-beranda.html');},600);</script>
</head>
<body>
  <div class="kb-bar"></div>
  <div class="kb-spin"></div>
  <div class="kb-txt">Memuat…</div>
  <noscript><a href="01-beranda.html">Buka beranda</a></noscript>
</body>
</html>
